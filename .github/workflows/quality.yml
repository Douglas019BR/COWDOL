name: quality guardrails

on:
  push:
  pull_request:

jobs:
  spell-and-secret:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install spell checker
        working-directory: frontend
        run: npm ci
      - name: Spell check
        run: frontend/node_modules/.bin/cspell --config cspell.json .
      - name: Secret scan
        run: python3 scripts/secret_scan.py
      - name: Secret scan tests
        run: python3 -m unittest scripts/test_secret_scan.py
